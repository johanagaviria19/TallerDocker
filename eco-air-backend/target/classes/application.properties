server.port=8080
spring.application.name=eco-air-backend

# -------------------------------------------------------
# Perfil local por defecto: H2 en memoria
# En Docker Compose las variables de entorno SPRING_DATASOURCE_*
# sobreescriben estas propiedades automáticamente.
# -------------------------------------------------------

# H2 In-memory database (desarrollo local sin Docker)
spring.datasource.url=jdbc:h2:mem:ecoairdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (solo activa cuando se usa H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.com.ecoair=INFO
